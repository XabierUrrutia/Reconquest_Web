{% extends "base.html" %}
{% block title %}Registro — Reconquest{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Reconquest">
    </div>
    <h1 class="auth-title">Registro</h1>
    <p class="auth-sub">// Únete a la resistencia</p>

    {% if error %}
    <div class="form-error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" id="reg-form">
      <div class="form-group">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username"
               placeholder="comandante_x" required autofocus>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="correo@dominio.com" required>
      </div>
      <div class="form-group">
        <label for="password">
          Contraseña
          <span style="color:var(--muted);font-size:.62rem;">(mínimo 8 caracteres)</span>
        </label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required minlength="8">
        <!-- Strength bar -->
        <div id="strength-bar" style="margin-top:.4rem;height:2px;background:rgba(87,101,51,.15);overflow:hidden;">
          <div id="strength-fill" style="height:100%;width:0;transition:width .3s,background .3s;"></div>
        </div>
        <p id="strength-label" style="font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--muted);margin-top:.25rem;letter-spacing:.1em;min-height:.9rem;"></p>
      </div>
      <div class="form-group">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" name="confirm"
               placeholder="••••••••" required>
        <p id="match-label" style="font-family:'Share Tech Mono',monospace;font-size:.62rem;margin-top:.25rem;letter-spacing:.1em;min-height:.9rem;"></p>
      </div>
      <button type="submit" class="btn-submit">Crear Cuenta</button>
    </form>

    <div class="auth-links">
      ¿Ya tienes cuenta? <span>·</span>
      <a href="{{ url_for('auth.login') }}">Iniciar sesión</a>
    </div>
  </div>
</div>

<script>
  /* Password strength */
  const pwInput  = document.getElementById('password');
  const fill     = document.getElementById('strength-fill');
  const lbl      = document.getElementById('strength-label');
  const colors   = ['#8b2020','#8b6020','#8C7F3B','#7ab87a'];
  const labels   = ['// Muy débil','// Débil','// Aceptable','// Fuerte'];

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 8)  score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const pct = v.length === 0 ? 0 : Math.max(1, score) * 25;
    fill.style.width = pct + '%';
    fill.style.background = colors[score - 1] || 'transparent';
    lbl.textContent = v.length > 0 ? (labels[score - 1] || '') : '';
    lbl.style.color = colors[score - 1] || 'var(--muted)';
  });

  /* Password match */
  const confirmInput = document.getElementById('confirm');
  const matchLbl     = document.getElementById('match-label');
  confirmInput.addEventListener('input', () => {
    if (!confirmInput.value) { matchLbl.textContent = ''; return; }
    const ok = confirmInput.value === pwInput.value;
    matchLbl.textContent = ok ? '// Coincide' : '// No coincide';
    matchLbl.style.color = ok ? '#7ab87a' : '#e8b0b0';
  });
</script>
{% endblock %}
